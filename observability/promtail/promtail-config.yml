server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: ltx-docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        regex: ltx-obs
        action: keep
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: compose_service
    pipeline_stages:
      - docker: {}

  - job_name: ltx-worker
    static_configs:
      - targets: [localhost]
        labels:
          job: ltx-worker
          __path__: /host/runs/*/worker.log
    pipeline_stages:
      - regex:
          expression: 'run_id=(?P<run_id>[0-9A-Za-z-]+)'
      - labels:
          run_id:
      - regex:
          expression: 'engine=(?P<engine>[^\s]+)'
      - labels:
          engine:

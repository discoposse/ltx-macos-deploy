global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'ltx-inference'
    static_configs:
      - targets: ['host.docker.internal:8001']  # Port where our Python instrumentation exposes metrics
    metrics_path: /metrics

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['localhost:8888']

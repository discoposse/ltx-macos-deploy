apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 5s
      httpMethod: POST

  - name: Loki
    type: loki
    access: proxy
    uid: loki
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        - datasourceUid: prometheus
          matcherRegex: "run_id=([0-9A-Za-z-]+)"
          name: Run
          url: "/d/ltx-run-trace?orgId=1&var-run_id=${__value.raw}"
          urlDisplayLabel: "Open run"
